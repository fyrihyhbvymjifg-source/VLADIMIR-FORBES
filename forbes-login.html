<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Forbes вход</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="assets/firebase-config.js"></script><link rel="stylesheet" href="assets/player-hovercard.css?v=1.0"><link rel="preconnect" href="https://www.gstatic.com" crossorigin><link rel="dns-prefetch" href="//www.gstatic.com"><link rel="stylesheet" href="assets/mobile.performance.v665.css?v=6.6.5"></head><body class="br-simple-page"><h1>BLACK RUSSIA FORBES</h1><h2>Вход владельца</h2><input id="nick" placeholder="Ник Forbes"><input id="pass" type="password" placeholder="Пароль"><button onclick="login()">Войти</button><p id="msg"></p><script>firebase.initializeApp(window.BR_FIREBASE_CONFIG);const db=firebase.database();function login(){db.ref('forbes').orderByChild('nickname').equalTo(document.getElementById('nick').value).once('value').then(s=>{let ok=false;s.forEach(x=>{if(x.val().password===document.getElementById('pass').value){ok=true;localStorage.forbes=x.key;}});document.getElementById('msg').textContent=ok?'Добро пожаловать':'Ник или пароль неверный';if(ok)location='profile.html'})}</script><script src="assets/player-hovercard.js?v=1.0"></script><script src="assets/runtime.optimize.v665.js?v=6.6.5" defer></script></body></html>
